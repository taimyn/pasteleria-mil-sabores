<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/main.css">

</head>

<body>
    <header>

        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">Te lo vendo</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                    aria-controls="menu" aria-expanded="false" aria-label="Abrir menu"> <span
                        class="navbar-toggler-icon"> </span></button>

                <div class="collapse navbar-collapse" id="menu">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link active" href="contacto.html">Contacto</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="contacto.html">Contacto</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="contacto.html">Contacto</a>
                        </li>

                    </ul>

                </div>
            </div>
        </nav>
    </header>





    <main class="container">
        <form class="bg-primary-subtle p-4 rounded shadow-5m mx-auto" action="#" method="post">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="nombre" class="form-label">Nombre Completo</label><br>
                    <input class="form-control" type="text" id="nombre" name="nombre" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="correo">Correo Electrónico</label><br>
                    <input class="form-control" type="email" id="correo" name="correo" required>
                </div>
            </div>


            <div class="mb-3">
                <label class="form-label" for="asunto">Asunto</label><br>
                <select class="form-select" id="asunto" name="asunto">
                    <option value="cotizacion">Cotización</option>
                    <option value="pedido">Estado de mi pedido</option>

                </select>
            </div>


            <div class="mb-4">
                <label class="form-label" for="mensaje">Mensaje</label><br>
                <textarea class="form-control" id="mensaje" name="mensaje" rows="5"></textarea>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="terminos">
                <label class="form-check-label" for="terminos"> Acepto ser contactado por correo</label>
            </div>


            <div>
                <button class="btn btn-primary btn-lg" type="submit">Enviar</button>
            </div>

        </form>

    </main>



    <footer>
        <section>
            <ul>
                <li>Whatsapp: <em>+5699800231</em></li>
                <li>profe@gmail.com</li>
                <li>Instagram</li>
            </ul>
        </section>
    </footer>

</body>

</html>
